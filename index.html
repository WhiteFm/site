<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="" data-i18n-attr-content="meta_home_description">
    <title></title>
    <link rel="icon" type="image/svg+xml" href="/icons/Elipse/Main_Logo.svg">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/mobile.css" media="screen and (max-width: 800px)">
</head>
<body data-page-title="meta_home_title">
    <header class="navbar">
        <div class="logo">
            <a href="/" aria-label="" data-i18n-attr-aria-label="aria_home_logo">
                <img src="/icons/Main_Logo.svg" alt="" class="site-logo" data-i18n-attr-alt="main_logo_alt">
                <span class="logo-wordmark" data-i18n="brand_name"></span>
            </a>
        </div>

        <nav aria-label="" data-i18n-attr-aria-label="aria_primary_navigation">
            <a href="/" class="active" aria-current="page" data-i18n="nav_home"></a>
            <a href="/workshops/" data-i18n="nav_products"></a>
            <a href="/tools/" data-i18n="nav_tools"></a>
            <a href="/tutorials/" data-i18n="nav_tutorials"></a>
            <a href="https://store.wsguild.net" target="_blank" rel="noreferrer" data-i18n="nav_store"></a>
            <a href="https://ccl.wsguild.net" target="_blank" rel="noreferrer" data-i18n="nav_ccl"></a>
        </nav>

        <div class="lang-switcher" aria-label="" data-i18n-attr-aria-label="aria_language_switcher">
            <button type="button" onclick="changeLang('en')" id="btn-en" aria-label="" data-i18n="lang_en_short" data-i18n-attr-aria-label="lang_en_label"></button>
            <button type="button" onclick="changeLang('ru')" id="btn-ru" aria-label="" data-i18n="lang_ru_short" data-i18n-attr-aria-label="lang_ru_label"></button>
            <button type="button" onclick="changeLang('sv')" id="btn-sv" aria-label="" data-i18n="lang_sv_short" data-i18n-attr-aria-label="lang_sv_label"></button>
        </div>
    </header>

    <main>
        <section class="hero hero-home">
            <img class="hero-background-logo" src="/icons/Elipse/Main_Logo.svg" alt="" aria-hidden="true">
            <div class="hero-content">
                <p class="eyebrow" data-i18n="hero_eyebrow"></p>
                <h1 data-i18n="hero_title"></h1>
                <p data-i18n="hero_desc"></p>
                <div class="hero-actions">
                    <a href="/workshops/" class="btn-primary" data-i18n="hero_btn"></a>
                    <a href="/tools/" class="btn-text" data-i18n="hero_secondary"></a>
                </div>
            </div>
        </section>

        <section class="intro-strip" aria-label="" data-i18n-attr-aria-label="aria_guild_overview">
            <p data-i18n="intro_text"></p>
        </section>

        <section class="programs" aria-labelledby="programs-heading">
            <div class="section-heading">
                <p class="eyebrow" data-i18n="programs_eyebrow"></p>
                <h2 id="programs-heading" class="section-title" data-i18n="programs_title"></h2>
                <p data-i18n="programs_lead"></p>
            </div>

            <div class="grid program-grid">
                <article class="card program-card">
                    <div class="card-icon" aria-hidden="true"><img src="/icons/Elipse/Cartograph_Logo.svg" alt=""></div>
                    <div class="card-content">
                        <h3 data-i18n="program_1_title"></h3>
                        <p data-i18n="program_1_desc"></p>
                    </div>
                    <a href="/workshops/" class="btn-secondary" data-i18n="btn_view_products"></a>
                </article>

                <article class="card program-card">
                    <div class="card-icon" aria-hidden="true"><img src="/icons/Elipse/TableTop_Logo.svg" alt=""></div>
                    <div class="card-content">
                        <h3 data-i18n="program_2_title"></h3>
                        <p data-i18n="program_2_desc"></p>
                    </div>
                    <a href="/workshops/" class="btn-secondary" data-i18n="btn_view_tools"></a>
                </article>

                <article class="card program-card highlight-card">
                    <div class="card-icon ccl-icon">
                        <img src="/icons/Elipse/CCL_Logo.svg" alt="">
                    </div>
                    <div class="card-content">
                        <h3 data-i18n="program_3_title"></h3>
                        <p data-i18n="program_3_desc"></p>
                    </div>
                    <a href="https://ccl.wsguild.net" target="_blank" rel="noreferrer" class="btn-secondary" data-i18n="btn_visit_ccl"></a>
                </article>
            </div>
        </section>

        <section class="guild-callout">
            <div>
                <p class="eyebrow" data-i18n="callout_eyebrow"></p>
                <h2 data-i18n="callout_title"></h2>
            </div>
            <div class="callout-action">
                <p data-i18n="callout_text"></p>
                <a href="/tutorials/" class="btn-primary callout-button" data-i18n="callout_tutorials_btn"></a>
            </div>
        </section>
    </main>

    <footer class="guild-footer">
        <p data-i18n="footer_text"></p>
    </footer>

    <script src="/js/main.js"></script>
</body>
</html>
