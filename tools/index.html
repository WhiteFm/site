<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="" data-i18n-attr-content="meta_tools_description">
    <title></title>
    <link rel="icon" type="image/svg+xml" href="/icons/Elipse/Main_Logo.svg">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/mobile.css" media="screen and (max-width: 800px)">
</head>
<body data-page-title="meta_tools_title">
    <header class="navbar">
        <div class="logo">
            <a href="/" aria-label="" data-i18n-attr-aria-label="aria_home_logo">
                <img src="/icons/Main_Logo.svg" alt="" class="site-logo" data-i18n-attr-alt="main_logo_alt">
                <span class="logo-wordmark" data-i18n="brand_name"></span>
            </a>
        </div>
        <nav aria-label="" data-i18n-attr-aria-label="aria_primary_navigation">
            <a href="/" data-i18n="nav_home"></a>
            <a href="/workshops/" data-i18n="nav_products"></a>
            <a href="/tools/" class="active" aria-current="page" data-i18n="nav_tools"></a>
            <a href="https://store.wsguild.net" target="_blank" rel="noreferrer" data-i18n="nav_store"></a>
            <a href="https://ccl.wsguild.net" target="_blank" rel="noreferrer" data-i18n="nav_ccl"></a>
        </nav>
        <div class="lang-switcher" aria-label="" data-i18n-attr-aria-label="aria_language_switcher">
            <button type="button" onclick="changeLang('en')" id="btn-en" aria-label="" data-i18n="lang_en_short" data-i18n-attr-aria-label="lang_en_label"></button>
            <button type="button" onclick="changeLang('ru')" id="btn-ru" aria-label="" data-i18n="lang_ru_short" data-i18n-attr-aria-label="lang_ru_label"></button>
        </div>
    </header>

    <main>
        <section class="page-hero tools-hero">
            <div class="page-hero-content">
                <p class="eyebrow" data-i18n="tools_eyebrow"></p>
                <h1 data-i18n="tools_title"></h1>
                <p data-i18n="tools_intro"></p>
            </div>
            <div class="hero-mark tool-mark" aria-hidden="true">+</div>
        </section>

        <section class="content-section tool-catalog">
            <div class="section-heading align-left">
                <p class="eyebrow" data-i18n="tools_catalog_eyebrow"></p>
                <h2 class="section-title" data-i18n="tools_catalog_title"></h2>
                <p data-i18n="tools_catalog_intro"></p>
            </div>

            <div class="tool-list">
                <article class="tool-row">
                    <div class="tool-symbol" aria-hidden="true">⚙</div>
                    <div>
                        <div class="tool-meta"><span data-i18n="tool_type_utility"></span><span data-i18n="tool_status_planned"></span></div>
                        <h3 data-i18n="tool_1_title"></h3>
                        <p data-i18n="tool_1_desc"></p>
                    </div>
                </article>
                <article class="tool-row">
                    <div class="tool-symbol" aria-hidden="true">✦</div>
                    <div>
                        <div class="tool-meta"><span data-i18n="tool_type_creative"></span><span data-i18n="tool_status_planned"></span></div>
                        <h3 data-i18n="tool_2_title"></h3>
                        <p data-i18n="tool_2_desc"></p>
                    </div>
                </article>
                <article class="tool-row">
                    <div class="tool-symbol" aria-hidden="true">◈</div>
                    <div>
                        <div class="tool-meta"><span data-i18n="tool_type_data"></span><span data-i18n="tool_status_planned"></span></div>
                        <h3 data-i18n="tool_3_title"></h3>
                        <p data-i18n="tool_3_desc"></p>
                    </div>
                </article>
            </div>
        </section>

        <section class="tool-note">
            <div class="tool-note-icon" aria-hidden="true">i</div>
            <div>
                <h2 data-i18n="tools_note_title"></h2>
                <p data-i18n="tools_note_text"></p>
            </div>
        </section>
    </main>

    <footer class="guild-footer"><p data-i18n="footer_text"></p></footer>
    <script src="/js/main.js"></script>
</body>
</html>
